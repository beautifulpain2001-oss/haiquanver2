name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cài Tkinter, Xvfb, thư viện cho Qt và Tesseract OCR tiếng Việt
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 tesseract-ocr tesseract-ocr-vie
      - run: pip install -r requirements-dev.txt
      - name: Self-test + pytest (gồm GUI smoke)
        run: xvfb-run -a python run_tests.py --gui
